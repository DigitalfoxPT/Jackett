name: Daily Upstream Sync

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/upstream-sync.yml'
  schedule:
    # Full source synchronization once per day.
    - cron: '17 0 * * *'
    # Lightweight release checks every six hours between full syncs.
    - cron: '17 6,12,18 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  sync:
    name: Merge Jackett upstream
    runs-on: windows-2025-vs2026
    env:
      # Keep GitHub CLI operations on this fork after adding the upstream remote.
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Check latest upstream release
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          FORK_REPOSITORY: ${{ github.repository }}
        run: |
          $tag = gh api repos/Jackett/Jackett/releases/latest --jq .tag_name
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($tag)) {
            throw "Unable to determine the latest Jackett upstream release."
          }

          $tag = $tag.Trim()
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Unexpected upstream release tag format: $tag"
          }

          gh release view $tag --repo $env:FORK_REPOSITORY *> $null
          $releaseMissing = $LASTEXITCODE -ne 0

          $fullSync = $env:EVENT_NAME -in @('workflow_dispatch', 'push') -or $env:SCHEDULE -eq '17 0 * * *'
          $needsSync = $fullSync -or $releaseMissing

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "missing=$($releaseMissing.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "full_sync=$($fullSync.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "needs_sync=$($needsSync.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

          if ($releaseMissing) {
            Write-Host "Upstream release $tag is not present in the fork. Source synchronization and build are required."
          }
          elseif ($fullSync) {
            Write-Host "Fork already has release $tag. Performing the scheduled daily source synchronization."
          }
          else {
            Write-Host "Fork already has release $tag. Lightweight release check complete; no source synchronization is required."
          }

          exit 0

      - name: Checkout fork
        if: steps.release.outputs.needs_sync == 'true'
        uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0

      - name: Fetch and merge upstream
        id: merge
        if: steps.release.outputs.needs_sync == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/Jackett/Jackett.git
          git fetch upstream master --tags

          $count = [int](git rev-list HEAD..upstream/master --count)
          if ($count -eq 0) {
            Write-Host "Fork source is already synchronized with upstream."
            "changed=false" >> $env:GITHUB_OUTPUT
            exit 0
          }

          Write-Host "$count upstream commit(s) to merge."
          git merge upstream/master --no-edit -X ours
          if ($LASTEXITCODE -ne 0) {
            git merge --abort
            $existing = gh issue list --state open --search 'Daily upstream sync conflict in:title' --json number --jq '.[0].number'
            if (-not $existing) {
              gh issue create --title "Daily upstream sync conflict" --body "The automated merge from Jackett/Jackett master failed. Manual conflict resolution is required before automatic synchronization can continue."
            }
            throw "Upstream merge failed."
          }

          "changed=true" >> $env:GITHUB_OUTPUT

      - name: Setup .NET 10
        if: steps.merge.outputs.changed == 'true'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Validate synchronized source
        id: validate
        if: steps.merge.outputs.changed == 'true'
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet restore src/Jackett.sln
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          dotnet build src/Jackett.sln -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          dotnet test src/Jackett.Test/Jackett.Test.csproj -c Release --no-build --framework net10.0-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Report validation failure
        if: steps.merge.outputs.changed == 'true' && steps.validate.outcome == 'failure'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $existing = gh issue list --state open --search 'Daily upstream validation failed in:title' --json number --jq '.[0].number'
          if (-not $existing) {
            gh issue create --title "Daily upstream validation failed" --body "The latest Jackett/Jackett master merged locally, but the Windows x64 / .NET 10 build or tests failed. The merge was not pushed to master. Review this workflow run before the next synchronization."
          }
          throw "Upstream validation failed. Master was not changed."

      - name: Push synchronized master
        if: steps.merge.outputs.changed == 'true' && steps.validate.outcome == 'success'
        shell: pwsh
        run: git push origin master

      - name: Build missing upstream release
        if: steps.release.outputs.missing == 'true' && (steps.merge.outputs.changed == 'false' || steps.validate.outcome == 'success')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.release.outputs.tag }}'
          Write-Host "Triggering Windows build for upstream release $tag."
          gh workflow run windows-build.yml --repo $env:GH_REPO --ref master
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to dispatch Windows build for $tag."
          }
